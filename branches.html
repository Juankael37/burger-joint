<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Settings - Big Buns Burger Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background: var(--warm-white); }
        .settings-container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .settings-header h1 { font-family: 'Poppins', sans-serif; font-size: 1.8rem; color: var(--dark-gray); margin: 0; }
        .back-btn { text-decoration: none; color: var(--primary-red); font-weight: 600; padding: 10px 20px; border: 2px solid var(--primary-red); border-radius: 8px; transition: all 0.3s; }
        .back-btn:hover { background: var(--primary-red); color: var(--white); }
        
        .add-branch-form { background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .add-branch-form h3 { margin: 0 0 20px 0; color: var(--dark-gray); font-size: 1.1rem; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .form-input { flex: 1; min-width: 200px; padding: 12px 15px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
        .form-input:focus { outline: none; border-color: var(--primary-red); }
        
        .branches-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        .branches-table th { background: var(--primary-red); color: var(--white); padding: 16px; text-align: left; font-weight: 600; font-size: 0.95rem; }
        .branches-table td { padding: 16px; border-bottom: 1px solid #eee; vertical-align: middle; }
        .branches-table tr:last-child td { border-bottom: none; }
        .branches-table tr:hover { background: #fafafa; }
        
        .branch-name-input { padding: 10px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 0.95rem; width: 220px; transition: border-color 0.3s; }
        .branch-name-input:focus { border-color: var(--primary-red); outline: none; }
        
        .slug-code { background: #f5f5f5; padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; color: var(--medium-gray); }
        
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.3s; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-save:hover { background: #388E3C; }
        .btn-edit { background: var(--secondary-color); color: white; }
        .btn-edit:hover { background: #1565C0; }
        .btn-delete { background: #F44336; color: white; }
        .btn-delete:hover { background: #D32F2F; }
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-badge.active { background: #E8F5E9; color: #2E7D32; }
        .status-badge.inactive { background: #FFEBEE; color: #C62828; }
        
        .empty-state { text-align: center; padding: 40px; color: var(--medium-gray); }
        .empty-state h3 { margin: 0 0 10px; color: var(--dark-gray); }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <h1>Branch Settings</h1>
            <a href="admin.html" class="back-btn">Back to Dashboard</a>
        </div>

        <div class="add-branch-form">
            <h3>Add New Branch</h3>
            <div class="form-row">
                <input type="text" id="newBranchName" class="form-input" placeholder="Branch Name (e.g., Downtown Branch)">
                <input type="text" id="newBranchLocation" class="form-input" placeholder="Location (e.g., Downtown District)">
                <button class="btn btn-primary" onclick="createBranch()">Add Branch</button>
            </div>
        </div>

        <table class="branches-table">
            <thead>
                <tr>
                    <th style="width: 25%;">Branch Name</th>
                    <th style="width: 15%;">Slug</th>
                    <th style="width: 20%;">Location</th>
                    <th style="width: 15%;">Status</th>
                    <th style="width: 25%;">Actions</th>
                </tr>
            </thead>
            <tbody id="branchesTableBody">
            </tbody>
        </table>
    </div>

    <div class="toast" id="toast">
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadBranches);

        async function loadBranches() {
            const tbody = document.getElementById('branchesTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">Loading branches...</td></tr>';
            
            try {
                const branches = await supabaseClient.getAllBranches();
                console.log('Loaded branches:', branches);
                
                if (!branches || branches.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><h3>No branches found</h3><p>Add your first branch using the form above.</p></div></td></tr>';
                    return;
                }

                tbody.innerHTML = branches.map(branch => `
                    <tr>
                        <td>
                            <input type="text" class="branch-name-input" id="name-${branch.id}" value="${escapeHtml(branch.name)}">
                        </td>
                        <td><span class="slug-code">${branch.slug}</span></td>
                        <td>${branch.location ? escapeHtml(branch.location) : '-'}</td>
                        <td>
                            <span class="status-badge ${branch.is_active ? 'active' : 'inactive'}">
                                ${branch.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-action btn-save" onclick="updateBranch('${branch.id}')">Save</button>
                                <button class="btn-action btn-edit" onclick="toggleStatus('${branch.id}', ${!branch.is_active})">
                                    ${branch.is_active ? 'Deactivate' : 'Activate'}
                                </button>
                                <button class="btn-action btn-delete" onclick="deleteBranch('${branch.id}', '${escapeHtml(branch.name)}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading branches:', error);
                tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><h3>Error loading branches</h3><p>' + error.message + '</p></div></td></tr>';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateSlug(name) {
            return name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').trim();
        }

        async function createBranch() {
            const nameInput = document.getElementById('newBranchName');
            const locationInput = document.getElementById('newBranchLocation');
            const name = nameInput.value.trim();
            const location = locationInput.value.trim();

            if (!name) {
                showToast('Please enter a branch name', 'error');
                return;
            }

            const branch = {
                name: name,
                slug: generateSlug(name),
                location: location || null,
                address: '',
                phone: '',
                is_active: true
            };

            try {
                await supabaseClient.addBranch(branch);
                nameInput.value = '';
                locationInput.value = '';
                showToast('Branch created successfully!');
                loadBranches();
                parent.postMessage({ type: 'branchUpdated' }, '*');
            } catch (error) {
                console.error('Error creating branch:', error);
                showToast('Failed to create branch', 'error');
            }
        }

        async function updateBranch(branchId) {
            const input = document.getElementById(`name-${branchId}`);
            const newName = input.value.trim();
            
            if (!newName) {
                showToast('Branch name cannot be empty', 'error');
                return;
            }

            try {
                await supabaseClient.updateBranch(branchId, { name: newName });
                showToast('Branch updated!');
                parent.postMessage({ type: 'branchUpdated' }, '*');
            } catch (error) {
                console.error('Error updating branch:', error);
                showToast('Failed to update branch', 'error');
            }
        }

        async function toggleStatus(branchId, makeActive) {
            try {
                await supabaseClient.updateBranch(branchId, { is_active: makeActive });
                showToast(`Branch ${makeActive ? 'activated' : 'deactivated'}!`);
                loadBranches();
                parent.postMessage({ type: 'branchUpdated' }, '*');
            } catch (error) {
                console.error('Error toggling status:', error);
                showToast('Failed to update status', 'error');
            }
        }

        async function deleteBranch(branchId, branchName) {
            if (!confirm(`Delete branch "${branchName}"? This cannot be undone.`)) return;

            try {
                await supabaseClient.deleteBranch(branchId);
                showToast('Branch deleted!');
                loadBranches();
                parent.postMessage({ type: 'branchUpdated' }, '*');
            } catch (error) {
                console.error('Error deleting branch:', error);
                showToast('Failed to delete branch', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
