<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Branch Settings - Big Buns Burger Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background: var(--light-gray); }

        .branches-container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }

        .page-title { font-family: 'Poppins', sans-serif; font-size: 1.6rem; color: var(--dark-gray); margin: 0 0 25px 0; }

        /* Add branch form */
        .add-branch-card {
            background: var(--white);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 25px;
            border: 2px dashed var(--border-color);
        }
        .add-branch-card h3 { margin: 0 0 16px 0; color: var(--dark-gray); font-size: 1rem; }
        .add-form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .add-form-group { flex: 1; min-width: 180px; }
        .add-form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--medium-gray); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .add-form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .add-form-group input:focus { outline: none; border-color: var(--primary-red); }

        /* Branch cards */
        .branch-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .branch-card:hover { border-color: var(--border-color); }
        .branch-card.editing { border-color: var(--primary-red); }

        .branch-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            cursor: pointer;
            gap: 15px;
        }
        .branch-card-header:hover { background: #fafafa; }

        .branch-info { flex: 1; }
        .branch-name-display { font-weight: 700; font-size: 1.05rem; color: var(--dark-gray); }
        .branch-meta { display: flex; gap: 15px; margin-top: 4px; flex-wrap: wrap; }
        .branch-meta span { font-size: 0.8rem; color: var(--medium-gray); }
        .branch-meta .slug-badge { background: #f5f5f5; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 0.78rem; }

        .branch-status-badge { padding: 5px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
        .branch-status-badge.active { background: #E8F5E9; color: #2E7D32; }
        .branch-status-badge.inactive { background: #FFEBEE; color: #C62828; }

        .expand-icon { font-size: 1.2rem; color: var(--medium-gray); transition: transform 0.3s; }
        .branch-card.open .expand-icon { transform: rotate(180deg); }

        /* Expandable details */
        .branch-details {
            display: none;
            padding: 0 24px 24px;
            border-top: 1px solid var(--border-color);
        }
        .branch-card.open .branch-details { display: block; }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        .details-grid .field-group { display: flex; flex-direction: column; }
        .details-grid .field-group.full-width { grid-column: 1 / -1; }
        .field-group label { font-size: 0.78rem; font-weight: 600; color: var(--medium-gray); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .field-group input, .field-group textarea {
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .field-group input:focus, .field-group textarea:focus { outline: none; border-color: var(--primary-red); }
        .field-group textarea { resize: vertical; min-height: 60px; }

        .branch-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            justify-content: space-between;
        }
        .branch-actions-left { display: flex; gap: 8px; }
        .btn-sm { padding: 8px 18px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-save:hover { background: #388E3C; }
        .btn-toggle { background: #FFF3E0; color: #E65100; }
        .btn-toggle:hover { background: #FFE0B2; }
        .btn-delete { background: #FFEBEE; color: #D32F2F; }
        .btn-delete:hover { background: #D32F2F; color: white; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--medium-gray); }
        .empty-state h3 { margin: 0 0 8px; color: var(--dark-gray); }

        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
            .add-form-row { flex-direction: column; }
            .add-form-group { min-width: 100%; }
            .branch-card-header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- Admin Header (matches admin.html) -->
    <header class="admin-header">
        <div class="admin-header-content">
            <div class="admin-logo">
                <span class="logo-icon">🍔</span>
                <span>Big Buns Burger</span>
            </div>
            <nav class="admin-nav">
                <a href="admin.html" class="nav-tab">🍕 Menu Items</a>
                <a href="orders-admin.html" class="nav-tab">📋 Orders</a>
                <a href="branches.html" class="nav-tab active">🏪 Branches</a>
                <a href="order.html" class="nav-tab" target="_blank">🛒 Order Page</a>
                <a href="index.html" class="nav-tab" target="_blank">🌐 View Site</a>
            </nav>
        </div>
    </header>

    <div class="branches-container">
        <h1 class="page-title">🏪 Branch Settings</h1>

        <!-- Add New Branch -->
        <div class="add-branch-card">
            <h3>➕ Add New Branch</h3>
            <div class="add-form-row">
                <div class="add-form-group">
                    <label>Branch Name</label>
                    <input type="text" id="newBranchName" placeholder="e.g., Downtown Branch">
                </div>
                <div class="add-form-group">
                    <label>Location</label>
                    <input type="text" id="newBranchLocation" placeholder="e.g., Downtown District">
                </div>
                <button class="btn btn-primary" onclick="createBranch()" style="white-space: nowrap; height: fit-content;">Add Branch</button>
            </div>
        </div>

        <!-- Branch List -->
        <div id="branchesList">
            <div class="empty-state">
                <h3>Loading branches...</h3>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadBranches);

        async function loadBranches() {
            const container = document.getElementById('branchesList');
            container.innerHTML = '<div class="empty-state"><h3>Loading branches...</h3></div>';
            
            try {
                const branches = await supabaseClient.getAllBranches();
                console.log('Loaded branches:', branches);
                
                if (!branches || branches.length === 0) {
                    container.innerHTML = '<div class="empty-state"><h3>No branches yet</h3><p>Add your first branch using the form above.</p></div>';
                    return;
                }

                container.innerHTML = branches.map(branch => renderBranchCard(branch)).join('');
            } catch (error) {
                console.error('Error loading branches:', error);
                container.innerHTML = `<div class="empty-state"><h3>Error loading branches</h3><p>${error.message}</p></div>`;
            }
        }

        function renderBranchCard(branch) {
            return `
            <div class="branch-card" id="branch-${branch.id}">
                <div class="branch-card-header" onclick="toggleBranchCard('${branch.id}')">
                    <div class="branch-info">
                        <div class="branch-name-display">${escapeHtml(branch.name)}</div>
                        <div class="branch-meta">
                            <span class="slug-badge">${branch.slug}</span>
                            ${branch.location ? `<span>📍 ${escapeHtml(branch.location)}</span>` : ''}
                            ${branch.phone ? `<span>📞 ${escapeHtml(branch.phone)}</span>` : ''}
                        </div>
                    </div>
                    <span class="branch-status-badge ${branch.is_active ? 'active' : 'inactive'}">
                        ${branch.is_active ? '● Active' : '● Inactive'}
                    </span>
                    <span class="expand-icon">▼</span>
                </div>
                <div class="branch-details">
                    <div class="details-grid">
                        <div class="field-group">
                            <label>Branch Name</label>
                            <input type="text" id="name-${branch.id}" value="${escapeHtml(branch.name)}">
                        </div>
                        <div class="field-group">
                            <label>Slug (URL identifier)</label>
                            <input type="text" id="slug-${branch.id}" value="${branch.slug}" style="background: #f9f9f9; color: #999;" readonly>
                        </div>
                        <div class="field-group">
                            <label>Location / Area</label>
                            <input type="text" id="location-${branch.id}" value="${escapeHtml(branch.location || '')}" placeholder="e.g., Mall of Asia Complex">
                        </div>
                        <div class="field-group">
                            <label>Phone Number</label>
                            <input type="text" id="phone-${branch.id}" value="${escapeHtml(branch.phone || '')}" placeholder="e.g., +63 917 123 4567">
                        </div>
                        <div class="field-group full-width">
                            <label>Full Address</label>
                            <input type="text" id="address-${branch.id}" value="${escapeHtml(branch.address || '')}" placeholder="e.g., 123 Main St., Makati City">
                        </div>
                    </div>
                    <div class="branch-actions">
                        <div class="branch-actions-left">
                            <button class="btn-sm btn-save" onclick="saveBranch('${branch.id}')">💾 Save Changes</button>
                            <button class="btn-sm btn-toggle" onclick="toggleStatus('${branch.id}', ${!branch.is_active})">
                                ${branch.is_active ? '⏸ Deactivate' : '▶ Activate'}
                            </button>
                        </div>
                        <button class="btn-sm btn-delete" onclick="deleteBranch('${branch.id}', '${escapeHtml(branch.name)}')">🗑 Delete</button>
                    </div>
                </div>
            </div>`;
        }

        function toggleBranchCard(id) {
            const card = document.getElementById(`branch-${id}`);
            card.classList.toggle('open');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateSlug(name) {
            return name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').trim();
        }

        async function createBranch() {
            const nameInput = document.getElementById('newBranchName');
            const locationInput = document.getElementById('newBranchLocation');
            const name = nameInput.value.trim();
            const location = locationInput.value.trim();

            if (!name) {
                showToast('Please enter a branch name', 'error');
                return;
            }

            const branch = {
                name: name,
                slug: generateSlug(name),
                location: location || null,
                address: '',
                phone: '',
                is_active: true
            };

            try {
                await supabaseClient.addBranch(branch);
                nameInput.value = '';
                locationInput.value = '';
                showToast('Branch created successfully!');
                loadBranches();
            } catch (error) {
                console.error('Error creating branch:', error);
                showToast('Failed to create branch: ' + error.message, 'error');
            }
        }

        async function saveBranch(branchId) {
            const name = document.getElementById(`name-${branchId}`).value.trim();
            const location = document.getElementById(`location-${branchId}`).value.trim();
            const phone = document.getElementById(`phone-${branchId}`).value.trim();
            const address = document.getElementById(`address-${branchId}`).value.trim();
            
            if (!name) {
                showToast('Branch name cannot be empty', 'error');
                return;
            }

            try {
                await supabaseClient.updateBranch(branchId, { 
                    name, 
                    location: location || null,
                    phone: phone || null,
                    address: address || null
                });
                showToast('Branch updated successfully!');
                loadBranches();
            } catch (error) {
                console.error('Error updating branch:', error);
                showToast('Failed to update branch: ' + error.message, 'error');
            }
        }

        async function toggleStatus(branchId, makeActive) {
            try {
                await supabaseClient.updateBranch(branchId, { is_active: makeActive });
                showToast(`Branch ${makeActive ? 'activated' : 'deactivated'}!`);
                loadBranches();
            } catch (error) {
                console.error('Error toggling status:', error);
                showToast('Failed to update status', 'error');
            }
        }

        async function deleteBranch(branchId, branchName) {
            if (!confirm(`Delete branch "${branchName}"? This cannot be undone.`)) return;

            try {
                await supabaseClient.deleteBranch(branchId);
                showToast('Branch deleted!');
                loadBranches();
            } catch (error) {
                console.error('Error deleting branch:', error);
                showToast('Failed to delete branch: ' + error.message, 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
