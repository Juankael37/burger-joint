<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Order fresh burgers, hot dogs, sides and drinks online from Big Buns Burger. Choose your branch and pick up in store.">
    <meta property="og:title" content="Order Now | Big Buns Burger">
    <meta property="og:description" content="Order fresh burgers, hot dogs, sides and drinks online from Big Buns Burger.">
    <meta property="og:type" content="restaurant">
    <title>Order Now | Big Buns Burger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .order-page { padding: 80px 20px 40px; max-width: 1200px; margin: 0 auto; }
        .order-header { text-align: center; margin-bottom: 40px; }
        .order-header h1 { font-size: 2.5rem; color: var(--primary-red); margin-bottom: 10px; }
        
        .order-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        
        .menu-section { margin-bottom: 30px; }
        .menu-section h2 { font-size: 1.5rem; margin-bottom: 20px; color: var(--dark-gray); border-bottom: 2px solid var(--primary-red); padding-bottom: 10px; }
        
        .order-menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        .order-item { background: var(--white); border: 2px solid var(--border-color); border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: var(--transition); }
        .order-item:hover { border-color: var(--primary-red); transform: translateY(-3px); }
        .order-item-name { font-weight: 700; display: block; margin-bottom: 5px; }
        .order-item-price { color: var(--primary-red); font-weight: 600; }
        .add-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background: var(--primary-red); color: var(--white); border-radius: 20px; font-size: 0.9rem; }
        
        .cart-sidebar { background: var(--white); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); position: sticky; top: 100px; height: fit-content; }
        .cart-sidebar h2 { font-size: 1.3rem; margin-bottom: 15px; }
        
        .cart-items-container { min-height: 200px; max-height: 400px; overflow-y: auto; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 0.95rem; }
        .cart-item-price { color: var(--primary-red); font-size: 0.9rem; }
        .cart-item-controls { display: flex; align-items: center; gap: 8px; }
        .cart-item-controls button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--white); cursor: pointer; }
        .cart-item-controls button:hover { background: var(--primary-red); color: var(--white); border-color: var(--primary-red); }
        .remove-btn { color: var(--primary-red) !important; font-size: 1.2rem; }
        
        .cart-total { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-top: 2px solid var(--dark-gray); margin-top: 15px; font-size: 1.2rem; font-weight: 700; }
        .cart-total span:last-child { color: var(--primary-red); font-size: 1.4rem; }
        
        .checkout-btn { width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 15px; }
        .empty-cart { text-align: center; color: var(--medium-gray); padding: 40px 20px; }
        
        @media (max-width: 768px) {
            .order-grid { grid-template-columns: 1fr; }
            .cart-sidebar { position: static; }
            
            .mobile-menu-btn {
                display: flex;
                flex-direction: column;
                gap: 5px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 8px;
            }
            .mobile-menu-btn span {
                display: block;
                width: 25px;
                height: 3px;
                background: var(--white);
                border-radius: 2px;
            }
            .nav-right {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--primary-red);
                padding: 20px;
                gap: 15px;
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
                transition: all 0.3s ease;
            }
            .nav-right.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: all;
            }
            .nav-right a {
                color: var(--white);
                font-size: 1.1rem;
            }
        }
        .order-item.unavailable-item { opacity: 0.6; }
        .order-item.unavailable-item .add-btn { background: var(--medium-gray); cursor: not-allowed; }
        .unavailable-label { display: block; color: var(--primary-red); font-size: 0.75rem; font-weight: 600; margin-top: 5px; }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo">Big Buns Burger</a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-right" id="navLinks">
                <a href="index.html">Home</a>
                <a href="order.html" class="active">Order</a>
            </div>
        </div>
    </nav>

    <div class="order-page">
        <div class="order-header">
            <h1>🍔 Order Here</h1>
            <div class="branch-badge" id="branchBadge"></div>
            <div class="order-notice">
                <span>📍 Pay at Counter &bull; Pickup in Store</span>
            </div>
        </div>
        
        <!-- Mobile Sticky Cart Button -->
        <div class="mobile-sticky-cart" id="mobileStickyCart">
            <button class="btn btn-primary" onclick="goToCheckout()">
                🛒 Checkout - <span id="mobileCartTotal">₱0.00</span>
            </button>
        </div>
        
        <div class="order-grid">
            <div class="menu-sections">
                <div class="menu-section">
                    <h2>🍔 Burgers</h2>
                    <div class="order-menu-grid" id="burgersGrid"></div>
                </div>
                <div class="menu-section">
                    <h2>🌭 Hot Dogs</h2>
                    <div class="order-menu-grid" id="hotdogsGrid"></div>
                </div>
                <div class="menu-section">
                    <h2>🍟 Sides</h2>
                    <div class="order-menu-grid" id="sidesGrid"></div>
                </div>
                <div class="menu-section">
                    <h2>🥤 Drinks</h2>
                    <div class="order-menu-grid" id="drinksGrid"></div>
                </div>
            </div>
            
            <aside class="cart-sidebar">
                <h2>🛒 Your Cart <span id="cartCount" style="color: var(--primary-red)">(0)</span></h2>
                <div class="cart-items-container" id="cartItems">
                    <div class="empty-cart">Your cart is empty</div>
                </div>
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn btn-primary checkout-btn" onclick="goToCheckout()">Checkout →</button>
            </aside>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/toast.js"></script>
    <script>
        // Cart functions directly in page
        let cart = JSON.parse(localStorage.getItem('bigBunsCart')) || [];
        
        function addToCart(item) {
            const existingItem = cart.find(i => i.name === item.name);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            localStorage.setItem('bigBunsCart', JSON.stringify(cart));
            updateCartUI();
            // Silent - no alert
        }
        
        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            let count = cart.reduce((sum, item) => sum + item.qty, 0);
            let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            if (cartCount) cartCount.textContent = '(' + count + ')';
            
            if (cartItems) {
                if (cart.length === 0) {
                    cartItems.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                } else {
                    cartItems.innerHTML = cart.map(item => `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <span class="cart-item-name">${item.name}</span>
                                <span class="cart-item-price">₱${item.price.toFixed(2)}</span>
                            </div>
                            <div class="cart-item-controls">
                                <button onclick="changeQty('${item.name}', -1)">-</button>
                                <span>${item.qty}</span>
                                <button onclick="changeQty('${item.name}', 1)">+</button>
                                <button class="remove-btn" onclick="removeItem('${item.name}')">×</button>
                            </div>
                        </div>
                    `).join('');
                }
            }
            
            if (cartTotal) cartTotal.textContent = '₱' + total.toFixed(2);
            
            // Update mobile sticky cart
            const mobileCartTotal = document.getElementById('mobileCartTotal');
            const mobileStickyCart = document.getElementById('mobileStickyCart');
            if (mobileCartTotal) mobileCartTotal.textContent = '₱' + total.toFixed(2);
            if (mobileStickyCart) mobileStickyCart.style.display = cart.length > 0 ? 'block' : 'none';
        }
        
        function changeQty(name, delta) {
            const item = cart.find(i => i.name === name);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.name !== name);
                }
                localStorage.setItem('bigBunsCart', JSON.stringify(cart));
                updateCartUI();
            }
        }
        
        function removeItem(name) {
            cart = cart.filter(i => i.name !== name);
            localStorage.setItem('bigBunsCart', JSON.stringify(cart));
            updateCartUI();
        }
        
        // Initialize cart UI
        updateCartUI();
        
        // Fallback menu data - matching actual menu
        const defaultMenuItems = [
            // Burgers
            { id: 'b1', category: 'Burgers', name: 'Classic Burger', price: 9.49 },
            { id: 'b2', category: 'Burgers', name: 'Bacon Burger', price: 10.99 },
            { id: 'b3', category: 'Burgers', name: 'Little Cheeseburger', price: 7.99 },
            { id: 'b4', category: 'Burgers', name: 'Bacon Cheeseburger', price: 11.99 },
            { id: 'b5', category: 'Burgers', name: 'Veggie Burger', price: 10.49 },
            // Hot Dogs
            { id: 'h1', category: 'Hot Dogs', name: 'Regular Hot Dog', price: 6.49 },
            { id: 'h2', category: 'Hot Dogs', name: 'Bacon Dog', price: 7.99 },
            { id: 'h3', category: 'Hot Dogs', name: 'Cheese Dog', price: 7.49 },
            // Sides
            { id: 's1', category: 'Sides', name: 'Little Fries', price: 4.49 },
            { id: 's2', category: 'Sides', name: 'Regular Fries', price: 5.99 },
            { id: 's3', category: 'Sides', name: 'Cheese Fries', price: 7.49 },
            { id: 's4', category: 'Sides', name: 'Onion Rings', price: 5.49 },
            // Drinks
            { id: 'd1', category: 'Drinks', name: 'Small Drink', price: 2.99 },
            { id: 'd2', category: 'Drinks', name: 'Large Drink', price: 3.49 },
            { id: 'd3', category: 'Drinks', name: 'Milkshake', price: 5.99 }
        ];

        // Load menu items for ordering
        async function loadOrderMenu() {
            let items = defaultMenuItems;
            
            const branchSlug = localStorage.getItem('bigBunsBranch');
            
            try {
                const fetchedItems = branchSlug 
                    ? await supabaseClient.getMenuItemsForBranch(branchSlug)
                    : await supabaseClient.getMenuItems();
                    
                if (fetchedItems && fetchedItems.length > 0) {
                    items = fetchedItems;
                }
            } catch (error) {
                console.log('Using fallback menu');
            }
            
            const categories = {
                burgersGrid: 'Burgers',
                hotdogsGrid: 'Hot Dogs',
                sidesGrid: 'Sides',
                drinksGrid: 'Drinks'
            };
            
            for (const [elementId, category] of Object.entries(categories)) {
                const categoryItems = items.filter(i => i.category === category);
                let html = '';
                categoryItems.forEach(item => {
                    const unavailable = (item.unavailable_at_branches || []).includes(branchSlug);
                    const disabledAttr = unavailable ? 'disabled' : '';
                    const unavailableClass = unavailable ? 'unavailable-item' : '';
                    const unavailableLabel = unavailable ? '<span class="unavailable-label">Unavailable</span>' : '';
                    html += `<div class="order-item ${unavailableClass}">
                        <span class="order-item-name">${item.name}</span>
                        <span class="order-item-price">₱${parseFloat(item.price).toFixed(2)}</span>
                        ${unavailableLabel}
                        <button class="add-btn" ${disabledAttr} onclick="addToCart({name:'${item.name}',price:${item.price}})">${unavailable ? 'Unavailable' : 'Add'}</button>
                    </div>`;
                });
                document.getElementById(elementId).innerHTML = html;
            }
        }
        
        function goToCheckout() {
            if (cart.length === 0) {
                toastWarning('Cart Empty', 'Please add items to your cart first');
                return;
            }
            window.location.href = 'checkout.html';
        }
        
        // Branch handling
        let currentBranch = null;
        const urlParams = new URLSearchParams(window.location.search);
        const branchSlug = urlParams.get('branch');
        
        if (branchSlug) {
            // Save to localStorage
            localStorage.setItem('bigBunsBranch', branchSlug);
            displayBranchBadge(branchSlug);
        } else {
            // Check localStorage
            const savedBranch = localStorage.getItem('bigBunsBranch');
            if (savedBranch) {
                displayBranchBadge(savedBranch);
            }
        }
        
        async function displayBranchBadge(slug) {
            const branchBadge = document.getElementById('branchBadge');
            try {
                const branches = await supabaseClient.getBranches();
                const branch = branches.find(b => b.slug === slug);
                if (branch) {
                    currentBranch = branch;
                    branchBadge.innerHTML = `<span class="branch-name">📍 ${branch.name}</span>`;
                } else {
                    // Fallback: capitalize first letter
                    const displayName = slug.charAt(0).toUpperCase() + slug.slice(1);
                    branchBadge.innerHTML = `<span class="branch-name">📍 ${displayName} Branch</span>`;
                }
            } catch (e) {
                console.log('Branch fetch error:', e);
                const displayName = slug.charAt(0).toUpperCase() + slug.slice(1);
                branchBadge.innerHTML = `<span class="branch-name">📍 ${displayName} Branch</span>`;
            }
        }
        
        loadOrderMenu();
        
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        if (mobileMenuBtn && navLinks) {
            mobileMenuBtn.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('open');
                });
            });
        }
        
        // Update mobile cart total
        function updateMobileCartTotal() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('mobileCartTotal').textContent = '₱' + total.toFixed(2);
            const stickyCart = document.getElementById('mobileStickyCart');
            stickyCart.style.display = cart.length > 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
