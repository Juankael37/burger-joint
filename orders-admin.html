<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Orders Admin | Big Buns Burger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .orders-admin { padding: 80px 20px 40px; max-width: 1000px; margin: 0 auto; }
        .orders-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .orders-header h1 { color: var(--primary-red); }
        
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .filter-tab { padding: 10px 20px; border: 2px solid var(--border-color); border-radius: 25px; cursor: pointer; font-weight: 600; background: var(--white); }
        .filter-tab:hover, .filter-tab.active { background: var(--primary-red); color: var(--white); border-color: var(--primary-red); }
        
        .orders-list { display: flex; flex-direction: column; gap: 15px; }
        
        .order-card { background: var(--white); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border-left: 5px solid var(--border-color); }
        .order-card.pending { border-left-color: #FF9800; }
        .order-card.claimed { border-left-color: #2196F3; }
        .order-card.completed { border-left-color: #4CAF50; }
        .order-card.rejected { border-left-color: #F44336; }
        
        .order-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .order-id { font-weight: 700; font-size: 1.1rem; }
        .order-pickup { font-size: 1.3rem; font-weight: 700; color: var(--primary-red); }
        .order-time { font-size: 0.85rem; color: var(--medium-gray); }
        
        .order-items-list { margin: 15px 0; padding: 15px; background: var(--light-gray); border-radius: 8px; }
        .order-item-row { display: flex; justify-content: space-between; padding: 5px 0; }
        
        .order-total { font-size: 1.2rem; font-weight: 700; text-align: right; margin: 15px 0; }
        
        .order-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .order-actions button { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        .btn-claim { background: #2196F3; color: var(--white); border: none; }
        .btn-complete { background: #4CAF50; color: var(--white); border: none; }
        .btn-reject { background: #F44336; color: var(--white); border: none; }
        
        .no-orders { text-align: center; padding: 60px; color: var(--medium-gray); font-size: 1.1rem; }
        
        .refresh-btn { padding: 10px 20px; background: var(--light-gray); border: none; border-radius: 8px; cursor: pointer; }
        .auto-refresh { font-size: 0.85rem; color: var(--medium-gray); }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo">Big Buns Burger</a>
            <div class="nav-right">
                <a href="index.html">Home</a>
                <a href="orders-admin.html">Orders</a>
                <a href="admin.html">Menu Admin</a>
            </div>
        </div>
    </nav>
    
    <div class="orders-admin">
        <div class="orders-header">
            <h1>📋 Orders</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
                <button class="btn btn-danger" onclick="deleteAllOrders()" style="padding: 8px 15px; font-size: 0.9rem;">🗑️ Delete All</button>
                <span class="auto-refresh">Auto-refreshs every 10s</span>
            </div>
        </div>
        
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterOrders('all')">All</button>
            <button class="filter-tab" onclick="filterOrders('pending')">Pending</button>
            <button class="filter-tab" onclick="filterOrders('claimed')">Claimed</button>
            <button class="filter-tab" onclick="filterOrders('completed')">Completed</button>
        </div>
        
        <div class="search-box" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
            <input type="text" id="orderSearch" placeholder="🔍 Search by order number..." 
                style="flex: 1; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem;"
                oninput="searchByOrderNumber(this.value)">
            <button onclick="clearSearch()" style="padding: 12px 20px; background: var(--light-gray); border: none; border-radius: 8px; cursor: pointer;">Clear</button>
        </div>
        
        <div class="branch-filter" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
            <label for="branchSelect" style="font-weight: 600;">Filter by Branch:</label>
            <select id="branchSelect" onchange="filterByBranch(this.value)" style="padding: 10px 15px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; min-width: 180px;">
                <option value="">All Branches</option>
            </select>
        </div>
        
        <div class="search-results" id="searchResults" style="display: none; margin-bottom: 15px; padding: 15px; background: #E3F2FD; border-radius: 8px;">
            <strong>Search Result:</strong> <span id="searchResultText"></span>
        </div>
        
        <div class="orders-list" id="ordersList"></div>
    </div>

<script src="js/supabase.js"></script>
    <script>
        let allOrders = [];
        let currentFilter = 'all';
        let currentSearchQuery = '';
        let currentBranchFilter = '';
        let branchesData = {};
        
        // Initialize from URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlBranchId = urlParams.get('branch');
        if (urlBranchId) {
            currentBranchFilter = urlBranchId;
        }
        
        async function loadBranches() {
            try {
                const response = await fetch('https://epbzzntbppyyxeisuvtr.supabase.co/rest/v1/branches?is_active=eq.true&order=name', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y'
                    }
                });
                const branches = await response.json();
                const select = document.getElementById('branchSelect');
                branches.forEach(branch => {
                    branchesData[branch.id] = branch;
                    const option = document.createElement('option');
                    option.value = branch.id;
                    option.textContent = branch.name;
                    if (branch.id === urlBranchId) option.selected = true;
                    select.appendChild(option);
                });
            } catch (error) {
                console.log('No branches found, using fallback');
            }
        }
        
        function filterByBranch(branchId) {
            currentBranchFilter = branchId;
            renderOrders();
        }
        
        

        async function loadOrders() {
            try {
                const response = await fetch('https://epbzzntbppyyxeisuvtr.supabase.co/rest/v1/orders?order=created_at.desc', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y'
                    }
                });
                allOrders = await response.json();
                // Restore search if exists
                if (currentSearchQuery) {
                    searchByOrderNumber(currentSearchQuery);
                } else {
                    renderOrders();
                }
            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }
        
        async function deleteAllOrders() {
            if (!confirm('🗑️ Delete all orders? This cannot be undone.')) return;
            
            const apiKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y';
            const baseUrl = 'https://epbzzntbppyyxeisuvtr.supabase.co/rest/v1/orders';
            
            let deleted = 0;
            let failed = 0;
            
            for (const order of allOrders) {
                try {
                    const response = await fetch(`${baseUrl}?id=eq.${order.id}`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': apiKey,
                            'Authorization': `Bearer ${apiKey}`,
                            'Prefer': 'return=minimal'
                        }
                    });
                    
                    if (response.ok) {
                        deleted++;
                    } else {
                        failed++;
                        console.log('Failed to delete:', order.id, response.status);
                    }
                } catch (e) {
                    failed++;
                    console.log('Error:', e);
                }
            }
            
            alert(`Deleted ${deleted} orders. Failed: ${failed}`);
            
            // Clear local array and reset
            allOrders = [];
            currentSearchQuery = '';
            document.getElementById('orderSearch').value = '';
            document.getElementById('searchResults').style.display = 'none';
            
            // Reload from server
            await loadOrders();
        }
        
        function filterOrders(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.toLowerCase().includes(status));
            });
            renderOrders();
        }
        
        function searchByOrderNumber(number) {
            currentSearchQuery = number; // Save search query
            const searchBox = document.getElementById('orderSearch');
            const searchResults = document.getElementById('searchResults');
            const searchResultText = document.getElementById('searchResultText');
            const ordersList = document.getElementById('ordersList');
            
            if (!number || number.length < 1) {
                searchResults.style.display = 'none';
                currentSearchQuery = '';
                renderOrders();
                return;
            }
            
            // Search by order_number (exact match first, then partial)
            const matchingOrders = allOrders.filter(o => 
                (o.order_number && o.order_number.includes(number)) ||
                (o.pickup_name && o.pickup_name.toLowerCase().includes(number.toLowerCase()))
            );
            
            if (matchingOrders.length === 1) {
                // Exact match found - show that order prominently
                searchResults.style.display = 'block';
                searchResultText.innerHTML = `<span style="color: green;">✓ Found! Order #${matchingOrders[0].order_number} - ${matchingOrders[0].pickup_name}</span>`;
                renderSearchResult(matchingOrders[0]);
            } else if (matchingOrders.length > 1) {
                // Multiple matches
                searchResults.style.display = 'block';
                searchResultText.innerHTML = `<span style="color: orange;">${matchingOrders.length} orders found. Showing all.</span>`;
                renderOrders(matchingOrders);
            } else {
                // No match
                searchResults.style.display = 'block';
                searchResultText.innerHTML = `<span style="color: red;">No order found for "${number}"</span>`;
                ordersList.innerHTML = '<div class="no-orders">No orders match this search</div>';
            }
        }
        
        function clearSearch() {
            currentSearchQuery = '';
            document.getElementById('orderSearch').value = '';
            document.getElementById('searchResults').style.display = 'none';
            renderOrders();
        }
        
        function renderSearchResult(order) {
            const ordersList = document.getElementById('ordersList');
            const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
            const time = new Date(order.created_at).toLocaleString();
            const branch = order.branch_id ? branchesData[order.branch_id] : null;
            const branchDisplay = branch ? `<div style="color: var(--primary-red); font-weight: 600;">📍 ${branch.name}</div>` : '';
            
            ordersList.innerHTML = `
                <div class="order-card ${order.status}" style="border: 3px solid var(--primary-red); transform: scale(1.02);">
                    <div class="order-header-row">
                        <div>
                            <div class="order-time">${time}</div>
                            <div class="order-id" style="font-size: 1.5rem;">🎯 Order #${order.order_number}</div>
                            <div style="font-size: 1.3rem; font-weight: bold;">👤 ${order.pickup_name}</div>
                            ${branchDisplay}
                        </div>
                        <div class="order-pickup">${order.status.toUpperCase()}</div>
                    </div>
                    
                    <div class="order-items-list">
                        ${items.map(item => {
                            const itemTotal = item.price * item.qty;
                            return `<div class="order-item-row">
                                <span>${item.qty}x ${item.name}</span>
                                <span>₱${itemTotal.toFixed(2)}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    
                    <div class="order-total">Total: ₱${parseFloat(order.total).toFixed(2)}</div>
                    
                    <div class="order-status" style="text-align: center; margin-bottom: 10px; padding: 10px; background: ${getStatusColor(order.status)}; color: white; border-radius: 5px; font-size: 1.1rem;">
                        ${order.status.toUpperCase()}
                    </div>
                    
                    <div class="order-actions" style="justify-content: center;">
                        ${order.status === 'pending' ? `<button class="btn-claim" data-id="${encodeURIComponent(order.id)}" data-status="claimed" style="padding: 15px 30px; font-size: 1.1rem; background: #2196F3; color: white; border: none; border-radius: 8px; cursor: pointer;">✅ Mark Claimed (Paid)</button>` : ''}
                        ${order.status === 'claimed' ? `<button class="btn-complete" data-id="${encodeURIComponent(order.id)}" data-status="completed" style="padding: 15px 30px; font-size: 1.1rem; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer;">✅ Complete Order</button>` : ''}
                    </div>
                </div>
            `;
        }
        
function renderOrders(customOrders = null) {
            const ordersList = document.getElementById('ordersList');
            let filtered = customOrders || (currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter));
            
            // Apply branch filter
            if (currentBranchFilter) {
                filtered = filtered.filter(o => o.branch_id === currentBranchFilter);
            }
            
            if (filtered.length === 0) {
                ordersList.innerHTML = '<div class="no-orders">No orders found</div>';
                return;
            }
            
 ordersList.innerHTML = filtered.map(order => {
                const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
                const time = new Date(order.created_at).toLocaleString();
                const safeId = encodeURIComponent(order.id);
                const branch = order.branch_id ? branchesData[order.branch_id] : null;
                const branchDisplay = branch ? `<div style="color: var(--primary-red); font-weight: 600; margin-top: 5px;">📍 ${branch.name}</div>` : '';
                
                return `
                    <div class="order-card ${order.status}">
                        <div class="order-header-row">
                            <div>
                                <div class="order-time">${time}</div>
                                <div class="order-id">Order #${order.id.slice(0, 8)}</div>
                                ${branchDisplay}
                            </div>
                            <div class="order-pickup">🎯 ${order.pickup_name}</div>
                        </div>
                        
                        <div class="order-items-list">
                            ${items.map(item => {
                                const itemTotal = item.price * item.qty;
                                return `<div class="order-item-row">
                                    <span>${item.qty}x ${item.name}</span>
                                    <span>₱${itemTotal.toFixed(2)}</span>
                                </div>`;
                            }).join('')}
                        </div>
                        
                        <div class="order-total">Total: ₱${parseFloat(order.total).toFixed(2)}</div>
                        
                        <div class="order-status" style="text-align: center; margin-bottom: 10px; padding: 8px; background: ${getStatusColor(order.status)}; color: white; border-radius: 5px;">
                            ${order.status.toUpperCase()}
                        </div>
                        
                        <div class="order-actions">
                            ${order.status === 'pending' ? `<button class="btn-claim" data-id="${safeId}" data-status="claimed">Mark Claimed</button>` : ''}
                            ${order.status === 'claimed' ? `<button class="btn-complete" data-id="${safeId}" data-status="completed">Complete Order</button>` : ''}
                            ${order.status !== 'completed' && order.status !== 'rejected' ? `<button class="btn-reject" data-id="${safeId}" data-status="rejected">Reject</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function getStatusColor(status) {
            const colors = { pending: '#FF9800', claimed: '#2196F3', completed: '#4CAF50', rejected: '#F44336' };
            return colors[status] || '#757575';
        }
        
        async function updateStatus(orderId, newStatus) {
            if (!confirm(`Mark this order as ${newStatus}?`)) return;
            
            console.log('Updating order:', orderId, 'to', newStatus);
            
            try {
                const response = await fetch(`https://epbzzntbppyyxeisuvtr.supabase.co/rest/v1/orders?id=eq.${orderId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y',
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errText = await response.text();
                    console.error('Error response:', errText);
                    throw new Error('Update failed: ' + errText);
                }
                
                alert(`Order marked as ${newStatus}!`);
                loadOrders();
            } catch (error) {
                console.error('Error updating order:', error);
                alert('Failed to update order: ' + error.message);
            }
        }
        
        // Auto-refresh every 10 seconds
        loadBranches();
        loadOrders();
        setInterval(loadOrders, 10000);
        
        // Add button click handlers
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('btn-claim') || e.target.classList.contains('btn-complete') || e.target.classList.contains('btn-reject')) {
                const orderId = decodeURIComponent(e.target.getAttribute('data-id'));
                const newStatus = e.target.getAttribute('data-status');
                updateStatus(orderId, newStatus);
            }
        });
    </script>
</body>
</html>
