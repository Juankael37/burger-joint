<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Big Buns Burger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .checkout-page { padding: 80px 20px 40px; max-width: 600px; margin: 0 auto; }
        .checkout-page h1 { text-align: center; color: var(--primary-red); margin-bottom: 30px; }
        
        .checkout-summary { background: var(--white); border-radius: 12px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .checkout-summary h2 { font-size: 1.2rem; margin-bottom: 15px; }
        
        .summary-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .summary-item:last-child { border-bottom: none; font-weight: 700; font-size: 1.1rem; }
        .summary-item .qty { color: var(--medium-gray); margin-right: 10px; }
        
        .checkout-form { background: var(--white); border-radius: 12px; padding: 25px; box-shadow: var(--shadow); }
        .checkout-form h2 { font-size: 1.2rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        .form-group input:focus { border-color: var(--primary-red); outline: none; }
        
        .order-note { background: #FFF3E0; border: 1px solid #FFB74D; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .order-note p { font-size: 0.9rem; color: #E65100; margin: 0; }
        
        .submit-order-btn { width: 100%; padding: 16px; font-size: 1.1rem; }
        
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--medium-gray); }
        
        .success-message { text-align: center; padding: 40px; }
        .success-message h2 { color: #2E7D32; margin-bottom: 20px; }
        .order-number { background: var(--light-gray); padding: 15px; border-radius: 8px; font-size: 1.2rem; font-weight: 700; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="checkout-page" id="checkoutPage">
        <a href="order.html" class="back-link">← Back to Menu</a>
        
        <h1>🧾 Checkout</h1>
        
        <div class="checkout-summary">
            <h2>Order Summary</h2>
            <div id="orderItems"></div>
            <div class="summary-item">
                <span>Total</span>
                <span id="orderTotal" style="color: var(--primary-red);">₱0.00</span>
            </div>
        </div>
        
        <div class="checkout-form">
            <h2>Pickup Details</h2>
            <div class="order-note">
                <p>💡 Payment will be collected at the counter when you pick up your order.</p>
            </div>
            
            <div class="form-group">
                <label for="pickupName">Your Name or Table Number</label>
                <input type="text" id="pickupName" placeholder="e.g., Mike or Table 5" required>
            </div>
            
            <button class="btn btn-primary submit-order-btn" onclick="submitOrder()">Place Order</button>
        </div>
    </div>
    
    <div class="checkout-page" id="successPage" style="display: none;">
        <div class="success-message" style="text-align: center; padding: 40px 20px;">
            <h2 style="font-size: 2.5rem; color: #2E7D32; margin-bottom: 20px;">✅ Order Placed!</h2>
            <div class="order-number" id="confirmPickup" style="background: var(--light-gray); padding: 20px; border-radius: 12px; margin: 20px 0;"></div>
            <a href="order.html" class="btn btn-primary" style="margin-top: 20px;">Order Again</a>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        // Load cart from localStorage
        let cart = JSON.parse(localStorage.getItem('bigBunsCart')) || [];
        
        function getCartTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }
        
        function renderCheckoutSummary() {
            const orderItems = document.getElementById('orderItems');
            const orderTotal = document.getElementById('orderTotal');
            
            if (cart.length === 0) {
                orderItems.innerHTML = '<p>Your cart is empty!</p>';
                return;
            }
            
            orderItems.innerHTML = cart.map(item => `
                <div class="summary-item">
                    <span><span class="qty">${item.qty}x</span> ${item.name}</span>
                    <span>₱${(item.price * item.qty).toFixed(2)}</span>
                </div>
            `).join('');
            
            orderTotal.textContent = '₱' + getCartTotal().toFixed(2);
        }
        
        async function submitOrder() {
            const pickupName = document.getElementById('pickupName').value.trim();
            
            if (!pickupName) {
                alert('Please enter your name or table number!');
                return;
            }
            
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            
            const orderData = {
                items: cart.map(item => ({ name: item.name, price: item.price, qty: item.qty })),
                total: getCartTotal(),
                pickup_name: pickupName,
                order_number: Math.floor(1000 + Math.random() * 9000) // Generate 4-digit number
            };
            
            try {
                // Create order via direct fetch
                const response = await fetch('https://epbzzntbppyyxeisuvtr.supabase.co/rest/v1/orders', {
                    method: 'POST',
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYnp6bnRicHB5eXhlaXN1dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjY2MzIsImV4cCI6MjA5MzI0MjYzMn0.w8GcCOAOIhi7Yx7Rhc8i8qszemDI6i0An9qSlTUye2Y',
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        items: orderData.items,
                        total: orderData.total,
                        pickup_name: orderData.pickup_name,
                        order_number: orderData.order_number,
                        status: 'pending'
                    })
                });
                
                if (!response.ok) throw new Error('Failed to create order');
                
                // Show success immediately (even if order saves slowly)
                document.getElementById('checkoutPage').style.display = 'none';
                document.getElementById('successPage').style.display = 'block';
                document.getElementById('confirmPickup').innerHTML = `
                    <div style="font-size: 2.5rem; font-weight: bold; color: var(--primary-red);">🎯 Order #${orderData.order_number}</div>
                    <div style="font-size: 1.3rem; margin-top: 10px;">Name: ${pickupName}</div>
                    <div style="font-size: 1.1rem; margin-top: 5px; color: var(--medium-gray);">Total: ₱${orderData.total.toFixed(2)}</div>
                `;
                
                // Add instruction message
                const instruction = document.createElement('div');
                instruction.style.cssText = 'background: #FFF3E0; padding: 20px; border-radius: 12px; margin-top: 25px; text-align: center;';
                instruction.innerHTML = `
                    <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 10px;">📢 At the counter, tell staff:</p>
                    <p style="font-size: 1.3rem;">"My order number is <strong>#${orderData.order_number}</strong>"</p>
                    <p style="font-size: 1rem; color: var(--medium-gray);">and my name is <strong>${pickupName}</strong></p>
                `;
                document.querySelector('.success-message').appendChild(instruction);
                
                // Clear cart
                clearCart();
            } catch (error) {
                console.error('Order error:', error);
                alert('Failed to place order. Please try again.');
            }
        }
        
        renderCheckoutSummary();
        
        function clearCart() {
            cart = [];
            localStorage.setItem('bigBunsCart', JSON.stringify(cart));
        }
    </script>
</body>
</html>
